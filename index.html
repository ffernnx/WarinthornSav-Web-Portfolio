<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warinthorn's Portfolio</title>
  <meta name="description" content="Portfolio of Warinthorn Savetamornkul — UX/UI designer, creative designer and interactive multimedia student at Mahidol University, working across product design, illustration and front-end development." />

  <!-- Open Graph (placeholder — add assets/images/share-image.jpg before launch) -->
  <meta property="og:title" content="Warinthorn's Portfolio Website" />
  <meta property="og:description" content="Selected work, art and experience from a UX/UI designer and interactive multimedia student." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/images/share-image.jpg" />

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    Single Page Application shell.
    main.js fetches data.json on load and renders the whole site
    (nav, every section, lightbox, scroll-to-top, footer) into #app.
    Must be served over http:// so fetch() can read data.json.
  -->
  <div id="app">
    <noscript>This portfolio needs JavaScript enabled to display its content.</noscript>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
